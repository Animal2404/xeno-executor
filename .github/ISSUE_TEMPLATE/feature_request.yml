name: Feature request
description: Suggest an API function, overlay feature, or runtime improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior and the Lua or UI surface you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Executor API
        - Overlay
        - Script runner
        - Injector
        - Build or CI
        - Documentation
    validations:
      required: true
